# Use zsh as default shell
set-option -g default-shell /bin/zsh

# Start zsh as a login shell (recommended)
# set-option -g default-command "/bin/zsh -c cd /home/hugo/code && /bin/zsh"
# Unbind the default prefix

unbind C-b

# Set new prefix to Ctrl+a
set-option -g prefix C-a

# Make sure you can still send literal Ctrl+a to programs
bind C-a send-prefix

# Split panes
bind | split-window -h
bind - split-window -v

# Switch panes using hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
# Split horizontally and stay in same directory
bind | split-window -h -c "#{pane_current_path}"

# Split vertically and stay in same directory
bind - split-window -v -c "#{pane_current_path}"
# Kill pane immediately, no prompt
unbind x
bind x kill-pane

# plugins
set -g @plugin 'tmux-plugins/tpm'

# Status & themes
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'alexwforsythe/tmux-which-key'
# initialize TPM (keep this at bottom)
run '~/.tmux/plugins/tpm/tpm'
# Window naming: use current directory
set -g automatic-rename on
set -g allow-rename off
set -g automatic-rename-format '#{b:pane_current_path}'


set -g @plugin 'aaronh/tmux-which-key'
unbind &
bind q kill-window


# Toggle synchronized panes with prefix + y
bind y setw synchronize-panes

# Correct terminal setup for Nerd Fonts
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

bind -r y split-window -h -l 33% -c "#{pane_current_path}" 'SESSION="copilot-$(pwd | md5sum | cut -c1-8)"; tmux has-session -t "$SESSION" 2>/dev/null || tmux new-session -d -s "$SESSION" -c "$PWD" "zsh -i -c copilot"; exec env TMUX="" tmux attach-session -t "$SESSION"'

setw -g mode-keys vi
set -sg escape-time 10
# Setup 'v' to begin selection, just like Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Setup 'y' to yank (copy), just like Vim
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
